app = "floorguide-qa-endpoint"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  GEMINI_MODEL = "gemini-3.7-flash"
  USE_MOCK_AI = "false"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
